[package]
name = "pdfidxtk"
version = "0.4.0"
edition = "2021"
description = "pitk — motor de evidencia PDF para auditorías: store local, content-addressed, aislamiento por cuenta"
authors = ["Tanok Tech"]
license = "MIT"
repository = "https://github.com/Tanok-Tech/pdfidxtk-oss"
readme = "README.md"
keywords = ["pdf", "evidence", "audit", "cli", "search"]
categories = ["command-line-utilities"]

[[bin]]
name = "pitk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
pdf_oxide = { version = "0.3.78", features = ["parallel", "rendering"] }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
